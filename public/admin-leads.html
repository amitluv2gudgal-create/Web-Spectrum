<!DOCTYPE html>
<html>
<head>
    <title>Admin Leads</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <header>
    <h1>Web Spectrum</h1>
    
    <nav id="navbar">

        <a href="index.html">Home</a>
        <a href="admin-leads.html">Admin Leads</a>
        <a href="pricing.html">Pricing</a>
    </nav>
</header>

<h1>Website Leads</h1>

<table border="1" cellpadding="10" width="100%">
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Company</th>
            <th>Message</th>
        </tr>
    </thead>

    <tbody id="leadTable"></tbody>
</table>

<script>

const token =
localStorage.getItem("token");

if(!token){

    window.location.href =
    "/login.html";
}

async function loadLeads(){

    const token =
    localStorage.getItem("token");

    if(!token){

        window.location.href =
        "/login.html";

        return;
    }

    const response = await fetch(
        "/api/leads",
        {
            headers: {
                Authorization:
                `Bearer ${token}`
            }
        }
    );

    if(response.status === 401){

        localStorage.removeItem("token");

        window.location.href =
        "/login.html";

        return;
    }

    const data = await response.json();

    let rows = "";

    data.forEach(lead => {

        rows += `
            <tr>
                <td>${lead.id}</td>
                <td>${lead.name}</td>
                <td>${lead.email}</td>
                <td>${lead.company}</td>
                <td>${lead.message}</td>
            </tr>
        `;
    });

    document
    .getElementById("leadTable")
    .innerHTML = rows;
}

loadLeads();

</script>

<script src="assets/js/navbar.js"></script>

</body>
</html>
